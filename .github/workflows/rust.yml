name: Zeacon Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Apply Zeacon branding
        shell: pwsh
        run: |
          $p = 'gui/Cargo.toml'
          (Get-Content $p -Raw).Replace('name = "capture_bypass_gui"','name = "zeacon"') | Set-Content $p
          $p = 'gui/build.rs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('name="capture_bypass"','name="zeacon"')
          $s = $s.Replace('res.set_icon("icon.ico");','res.set_icon("icon.ico"); res.set("ProductName", "zeacon"); res.set("FileDescription", "zeacon"); res.set("InternalName", "zeacon.exe"); res.set("OriginalFilename", "zeacon.exe"); res.set("CompanyName", "zeacon");')
          $s | Set-Content $p
          $p = 'gui/src/main.rs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('auto_inject: false,','auto_inject: true,').Replace('silent_startup: false,','silent_startup: true,').Replace('.with_title("capture-bypass")','.with_title("zeacon").with_taskbar(false)').Replace('"capture-bypass", options','"zeacon", options').Replace('.with_tooltip("capture-bypass")','.with_tooltip("zeacon")').Replace('Some("capture-bypass")','Some("zeacon")').Replace('Some("capture-bypass — protected windows detected!")','Some("zeacon")').Replace('RichText::new("capture-bypass")','RichText::new("zeacon")')
          $s | Set-Content $p
      - name: Build Zeacon
        run: cargo build --release -p gui
      - uses: actions/upload-artifact@v4
        with:
          name: zeacon-windows-x64
          path: target/release/zeacon.exe
